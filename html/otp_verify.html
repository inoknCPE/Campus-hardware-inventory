{% extends "base.html" %}
{% block title %}Verify Email | Campus Hardware Inventory{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
    <p class="eyebrow">Two-step verification</p>
    <h1>Verify your email</h1>
    <p class="muted">Enter the 6-digit code sent to your email. The code expires in 10 minutes.</p>
    <form method="post" action="{{ url_for('verify_otp', action=action) }}" class="grid">
        <label for="otp_code">Verification code
            <input id="otp_code" name="otp_code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required autofocus>
        </label>
        <button type="submit">Verify code</button>
    </form>
    <p><a href="{{ url_for('register' if action == 'register' else 'reset_request') }}">Back</a> · <a href="{{ url_for('login') }}">Sign in</a></p>
</div></div>
{% endblock %}
